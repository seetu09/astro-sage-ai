<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AstroSage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #1e1b4b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #4338ca; }
    p { font-size: 16px; color: #312e81; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      background: #4F46E5;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover { background: #4338ca; }
    .stars {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <div class="stars">✨ 🌙 ✨ 🕉️ ✨</div>
  <div class="icon">🌙</div>
  <h1>You are offline</h1>
  <p>The cosmic connection is temporarily lost.<br>Please check your internet and try again.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
